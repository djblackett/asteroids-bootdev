name: Deploy to GitHub Pages

# Publishes the Phaser 4 port in phaser-asteroids/ as the whole GitHub Pages site, at the repository root:
# https://djblackett.github.io/asteroids-bootdev/
#
# Pull requests only run the validation job. Nothing is deployed unless the run is on `main`; a manual run from
# another branch validates but never publishes. See phaser-asteroids/docs/deployment.md.

on:
  push:
    branches:
      - main
    # Only the Phaser app (and this workflow) can change the site. The original Python game lives in the repository
    # root and is not published, so changes to it never trigger a deployment.
    paths:
      - "phaser-asteroids/**"
      - ".github/workflows/deploy-gh-pages.yml"
  # No path filter on purpose: a path-filtered workflow that is a required status check leaves PRs that touch
  # other paths waiting forever. The validation job takes about two minutes.
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Least privilege by default; only the `deploy` job is granted the Pages permissions.
permissions:
  contents: read

jobs:
  # Blocks deployment: typecheck, unit tests, production build, and a real-browser check of that build served
  # at the Pages URL path (/asteroids-bootdev/) and at "/". The larger browser suites run separately (browser-suites.yml).
  phaser:
    name: Phaser - validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: phaser-asteroids
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Vite 8 needs 20.19+ / 22.12+, Vitest 5 needs 22.12+ / 24+. Developed on 22.14.
          node-version: 22
          cache: npm
          cache-dependency-path: phaser-asteroids/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build (typecheck + vite build)
        env:
          # Public Worker origin; set this repository Actions variable after backend verification.
          # Backend secrets must never be supplied to Vite.
          VITE_LEADERBOARD_API_URL: ${{ vars.VITE_LEADERBOARD_API_URL }}
        run: npm run build

      - name: Browser check of the production build
        # Uses the Chrome preinstalled on GitHub's ubuntu runners; fails (does not skip) if it is missing.
        run: |
          google-chrome --version
          node scripts/pages-check.mjs

      - name: Upload build for deployment
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v7
        with:
          name: phaser-site
          path: phaser-asteroids/dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: phaser
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # publish to Pages
      id-token: write # prove to Pages that the deployment comes from this workflow
    # Deployments are serialised and never cancelled half-way, so overlapping pushes cannot corrupt publication.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the build
        uses: actions/download-artifact@v8
        with:
          name: phaser-site
          path: site

      - name: Check the assembled site
        run: |
          test -f site/index.html
          test -f site/audio/music/retro-bgmusic.ogg
          test -d site/assets
          find site -maxdepth 2 | sort

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
