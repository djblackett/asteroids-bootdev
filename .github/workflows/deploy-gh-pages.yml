name: Deploy to GitHub Pages

# Releases the production Worker, verifies compatibility, then publishes the Phaser 4 port to GitHub Pages:
# https://djblackett.github.io/asteroids-bootdev/
#
# Pull requests only run the validation job. Nothing is deployed unless the run is on `main`; a manual run from
# another branch validates but never publishes. See phaser-asteroids/docs/deployment.md.

on:
  push:
    branches:
      - main
    # Only the Phaser app (and this workflow) can change the site. The original Python game lives in the repository
    # root and is not published, so changes to it never trigger a deployment.
    paths:
      - "phaser-asteroids/**"
      - ".github/workflows/deploy-gh-pages.yml"
  # No path filter on purpose: a path-filtered workflow that is a required status check leaves PRs that touch
  # other paths waiting forever. The validation job takes about two minutes.
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Least privilege by default; only the `deploy` job is granted the Pages permissions.
permissions:
  contents: read

# Hold the release lock through validation, Worker deployment/verification AND Pages publication.
# PRs and non-main manual runs have separate groups. Never cancel a release halfway through.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Blocks deployment: typecheck, unit tests, production build, and a real-browser check of that build served
  # at the Pages URL path (/asteroids-bootdev/) and at "/". The larger browser suites run separately (browser-suites.yml).
  phaser:
    name: Phaser - validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact_name: phaser-site-${{ github.run_attempt }}
    defaults:
      run:
        working-directory: phaser-asteroids
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Vite 8 needs 20.19+ / 22.12+, Vitest 5 needs 22.12+ / 24+. Developed on 22.14.
          node-version: 22
          cache: npm
          cache-dependency-path: phaser-asteroids/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build (typecheck + vite build)
        env:
          # Public Worker origin; set this repository Actions variable after backend verification.
          # Backend secrets must never be supplied to Vite.
          VITE_LEADERBOARD_API_URL: ${{ vars.VITE_LEADERBOARD_API_URL }}
        run: |
          if [ -z "$VITE_LEADERBOARD_API_URL" ]; then
            echo "::error::Set the repository Actions variable VITE_LEADERBOARD_API_URL to the production Worker origin before building."
            exit 1
          fi
          npm run build

      - name: Browser check of the production build
        # Uses the Chrome preinstalled on GitHub's ubuntu runners; fails (does not skip) if it is missing.
        run: |
          google-chrome --version
          node scripts/pages-check.mjs

      # npm test above already includes server/tests; do not run the same suite twice.
      - name: Install locked server dependencies and typecheck
        run: |
          npm ci --prefix server
          npm --prefix server run typecheck

      - name: Test production health verification (mock HTTP only)
        run: node --test scripts/production-health.test.mjs

      - name: Upload build for deployment
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v7
        with:
          # Preserve earlier attempts' artifacts and avoid immutable-name conflicts on reruns.
          name: phaser-site-${{ github.run_attempt }}
          path: phaser-asteroids/dist
          if-no-files-found: error
          retention-days: 7

  worker:
    name: Deploy and verify production Worker
    needs: phaser
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_attempt: ${{ steps.verification.outputs.release_attempt }}
    defaults:
      run:
        working-directory: phaser-asteroids/server
    steps:
      - name: Checkout the validated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: phaser-asteroids/server/package-lock.json

      - name: Install locked Wrangler dependency
        run: npm ci

      - name: Download the validated build (includes shared replay versions)
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.phaser.outputs.artifact_name }}
          path: phaser-asteroids/dist

      # Concurrency does not guarantee commit order. Reject old queued runs and old reruns.
      # Once this passes, finish BOTH deployments even if main advances while releasing.
      - name: Refuse a stale release
        run: |
          latest=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "::error::This commit is no longer main. Run the release workflow on current main instead."
            exit 1
          fi

      - name: Deploy the existing production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Set the repository Actions secret CLOUDFLARE_API_TOKEN before releasing."
            exit 1
          fi
          npx wrangler deploy --env production

      - name: Verify production health and replay compatibility
        id: verification
        run: |
          node ../scripts/production-health.mjs
          echo "release_attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to GitHub Pages
    needs: [phaser, worker]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # publish to Pages
      id-token: write # prove to Pages that the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # A rerun of only Pages would otherwise reuse a prior attempt's successful Worker job.
      - name: Require Worker verification in this release attempt
        env:
          WORKER_ATTEMPT: ${{ needs.worker.outputs.release_attempt }}
        run: |
          if [ "$WORKER_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" ]; then
            echo "::error::Re-run all jobs so the Worker and health gate run in this attempt before Pages."
            exit 1
          fi

      - name: Download the build
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.phaser.outputs.artifact_name }}
          path: site

      - name: Check the assembled site
        run: |
          test -f site/index.html
          test -f site/audio/music/retro-bgmusic.ogg
          test -d site/assets
          find site -maxdepth 2 | sort

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
